name: dhanviq
description: "DHANVIQ - Personal Finance Management Application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  flutter_windowmanager_plus: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/dhanviq_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0752F4"
  adaptive_icon_foreground: "assets/icon/dhanviq_launcher.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  
flutter_native_splash:
  color: "#061533"
  image: "assets/icon/dhanviq_splash_logo_1024.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center

  